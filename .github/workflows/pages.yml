name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 7200
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      # The pinned Yarn and its lockfile; a lockless npm install crashed from 2026-10-18 ('edgesOut').
      - name: Install dependencies
        run: yarn install --immutable

      # Yarn 4 runs no post-scripts, so postbuild runs by name.
      - name: Build
        run: yarn build && yarn postbuild

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          # v5 excludes dotfiles by default; docs/.nojekyll (copied from
          # public/.nojekyll by the Astro build) must survive so GitHub
          # Pages does not run Jekyll over the _astro/ asset folder.
          include-hidden-files: true

  deploy:
    timeout-minutes: 7200
    needs: build
    runs-on: [self-hosted, Linux, X64, beast-unit]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
